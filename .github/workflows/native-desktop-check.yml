name: Native desktop workbook review
on:
  push:
    branches: ['native-desktop-check-20261123']
    paths:
      - '.github/workflows/native-desktop-check.yml'
      - 'native-desktop-check/**'
      - 'resources/workforce/powerbi-project.zip'
permissions:
  contents: read
jobs:
  powerbi:
    if: ${{ !contains(github.event.head_commit.message, 'Tableau executable retry') }}
    runs-on: windows-2025
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UI test dependencies
        run: python -m pip install pywinauto pillow pywin32
      - name: Install signed Microsoft Power BI Desktop on test VM
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          whoami
          Get-Process -Id $PID | Select-Object ProcessName,SessionId
          $ProgressPreference='SilentlyContinue'
          $installer=Join-Path $env:RUNNER_TEMP 'PBIDesktopSetup-x64.exe'
          $url='https://download.microsoft.com/download/8/8/0/880BCA75-79DD-466A-927D-1ABF1F5454B0/PBIDesktopSetup-2026-10_x64.exe'
          curl.exe --fail --location --retry 2 --output $installer $url
          if($LASTEXITCODE -ne 0){throw 'Power BI installer download failed'}
          $signature=Get-AuthenticodeSignature $installer
          Write-Host "Signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          if($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft'){throw 'Installer signature was not verified'}
          $p=Start-Process $installer -ArgumentList @('-quiet','-norestart','ACCEPT_EULA=1','DISABLE_UPDATE_NOTIFICATION=1','ENABLECXP=0','INSTALLDESKTOPSHORTCUT=0') -Wait -PassThru
          Write-Host "Install exit $($p.ExitCode)"
          if($p.ExitCode -notin @(0,3010)){throw 'Power BI installer failed'}
          $exe=Get-ChildItem "$env:ProgramFiles\Microsoft Power BI Desktop" -Filter PBIDesktop.exe -Recurse | Select-Object -First 1
          if(-not $exe){throw 'Installed Power BI Desktop executable was not found'}
          Write-Host "Installed version $($exe.VersionInfo.ProductVersion)"
          "POWERBI_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Open workforce project in Power BI Desktop
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence\powerbi | Out-Null
          Expand-Archive resources\workforce\powerbi-project.zip -DestinationPath "$env:RUNNER_TEMP\Workforce" -Force
          python native-desktop-check\check_desktop.py --kind powerbi --exe "$env:POWERBI_EXE" --file "$env:RUNNER_TEMP\Workforce\Workforce.pbip" --output evidence\powerbi
          exit $LASTEXITCODE
      - name: Verify every native model row and all six DAX measures
        if: always()
        shell: pwsh
        run: |
          if(-not $env:POWERBI_EXE){throw 'Power BI Desktop not installed'}
          $portFile = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\Power BI Desktop\AnalysisServicesWorkspaces" -Filter msmdsrv.port.txt -Recurse -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if(-not $portFile){throw 'No native Power BI model workspace found'}
          $port= (Get-Content $portFile.FullName -Raw).Trim() -replace '[^0-9]',''
          dotnet run --project native-desktop-check/QueryPowerBI.csproj -c Release -- $port native-desktop-check/expected-model.json evidence/powerbi
          if($LASTEXITCODE -ne 0){throw 'Native model verification failed'}
      - name: Inspect report pages after data refresh
        if: always()
        shell: pwsh
        run: |
          if(-not $env:POWERBI_EXE){throw 'Power BI Desktop not installed'}
          python native-desktop-check/check_desktop.py --kind powerbi --exe "$env:POWERBI_EXE" --file "$env:RUNNER_TEMP\Workforce\Workforce.pbip" --output evidence/powerbi-after-refresh --attach --skip-refresh
          if(Test-Path evidence/powerbi-after-refresh){Copy-Item evidence/powerbi-after-refresh evidence/powerbi -Recurse -Force}
          exit $LASTEXITCODE
      - name: Upload Power BI Desktop observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerbi-desktop-evidence
          path: evidence/powerbi
          retention-days: 3
          if-no-files-found: warn
  tableau:
    if: ${{ !contains(github.event.head_commit.message, 'Power BI refresh retry') }}
    runs-on: windows-2025
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install UI test dependencies
        run: python -m pip install pywinauto pillow pywin32
      - name: Install signed Tableau Desktop Public Edition on test VM
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          whoami
          Get-Process -Id $PID | Select-Object ProcessName,SessionId
          $ProgressPreference='SilentlyContinue'
          $installer=Join-Path $env:RUNNER_TEMP 'TableauPublicDesktop-x64.exe'
          $url='https://downloads.tableau.com/public/TableauPublicDesktop-64bit-2026-1-0.exe'
          curl.exe --fail --location --retry 2 --output $installer $url
          if($LASTEXITCODE -ne 0){throw 'Tableau installer download failed'}
          $signature=Get-AuthenticodeSignature $installer
          Write-Host "Signature: $($signature.Status) $($signature.SignerCertificate.Subject)"
          if($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Tableau|Salesforce'){throw 'Installer signature was not verified'}
          $p=Start-Process $installer -ArgumentList @('/quiet','/norestart','ACCEPTEULA=1','SENDTELEMETRY=0','AUTOUPDATE=0','DESKTOPSHORTCUT=0') -Wait -PassThru
          Write-Host "Install exit $($p.ExitCode)"
          if($p.ExitCode -notin @(0,3010)){throw 'Tableau installer failed'}
          $exe=Get-ChildItem "$env:ProgramFiles\Tableau" -Filter '*.exe' -Recurse | Where-Object {$_.Name -match '^(tableau|tableaupublic|tabpublic|tableau public)\.exe$'} | Select-Object -First 1
          if(-not $exe){Get-ChildItem "$env:ProgramFiles\Tableau" -Filter '*.exe' -Recurse | Select-Object Name,FullName; throw 'Installed Tableau Desktop executable was not found'}
          Write-Host "Installed version $($exe.VersionInfo.ProductVersion)"
          "TABLEAU_EXE=$($exe.FullName)" >> $env:GITHUB_ENV
      - name: Open packaged retail workbook in Tableau Desktop Public Edition
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence\tableau | Out-Null
          python native-desktop-check\check_desktop.py --kind tableau --exe "$env:TABLEAU_EXE" --file resources\retail\retail-forecast.twbx --output evidence\tableau\dashboard
          $first = $LASTEXITCODE
          if($first -ne 0){
            Get-Process tabpublic -ErrorAction SilentlyContinue | Stop-Process -Force
            Start-Sleep 3
            python native-desktop-check\check_desktop.py --kind tableau --exe "$env:TABLEAU_EXE" --file native-desktop-check\retail-forecast-sheets.twbx --output evidence\tableau\sheets
            exit $LASTEXITCODE
          }
          exit $first
      - name: Capture Tableau workbook diagnostics
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence\tableau | Out-Null
          $documents=[Environment]::GetFolderPath('MyDocuments')
          $logs=Get-ChildItem (Join-Path $documents 'My Tableau Repository\Logs') -Filter '*.txt' -ErrorAction SilentlyContinue
          foreach($log in $logs){
            $matched=Select-String -Path $log.FullName -Pattern '"sev":"(error|fatal|warn)"|exception|error-code-id|open-workbook|workbook-open|error opening|workbook.*failed' -ErrorAction SilentlyContinue | Select-Object -Last 200
            if($matched){$matched | ForEach-Object {$_.Line} | Set-Content -Encoding utf8 (Join-Path 'evidence\tableau' ($log.BaseName+'-workbook.txt'))}
          }
      - name: Upload Tableau Desktop observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tableau-desktop-evidence
          path: evidence/tableau
          retention-days: 3
          if-no-files-found: warn
