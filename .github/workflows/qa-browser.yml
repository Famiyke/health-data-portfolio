name: Verify portfolio responsive layout
on:
  push:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'qa_portfolio.py'
      - '.github/workflows/qa-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright
      - run: python -m playwright install chromium --with-deps
      - run: python qa_portfolio.py home
