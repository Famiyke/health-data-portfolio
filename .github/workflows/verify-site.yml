name: Verify deployed portfolio homepage
on:
  push:
    paths:
      - '.github/workflows/verify-site.yml'
  workflow_dispatch:
jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Verify public site matches the audited version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          import time
          url = "https://famiyke.github.io/health-data-portfolio/"
          files = ("index.html", "project.html", "assets/site.js", "assets/projects.js", "assets/expansion.js", "assets/portfolio-additions.js", "resources/index.html", "resources/process/workflow.zip")
          for attempt in range(12):
              try:
                  stale = []
                  for name in files:
                      req = Request(f"{url}{name}?validate={int(time.time())}", headers={"User-Agent":"Portfolio-QA/1.0","Cache-Control":"no-cache"})
                      with urlopen(req, timeout=20) as response:
                          if response.read() != Path(name).read_bytes():
                              stale.append(name)
                  if not stale:
                      print("PASS: deployed portfolio matches the audited site and workflow")
                      break
                  print(f"Attempt {attempt+1}: stale files={stale}")
              except Exception as err:
                  print(f"Attempt {attempt+1}: fetch failed: {err}")
              if attempt == 11:
                  raise SystemExit("FAIL: deployed site did not match current revision")
              time.sleep(15)
          PY
